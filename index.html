<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VortexX — Verified</title>
<meta name="description" content="VortexX verification complete — your access is unlocked. Continue to proceed.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e40af'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-size='38' font-weight='bold' fill='%23ffd60a' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --royal:#1e40af;
    --royal-deep:#172554;
    --royal-bright:#4f8cff;
    --white:#ffffff;
    --yellow:#ffd60a;
    --yellow-deep:#f5c400;
    --ink:#f4f7ff;
    --muted:#9fb0cd;
    --line:#1e2b45;
    --panel:#0b1220;
    --bg:#05070d;
    --shadow:0 30px 80px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--ink);
    min-height:100vh;
    background:
      radial-gradient(900px 520px at 88% -8%,rgba(43,92,230,.22),transparent 62%),
      radial-gradient(720px 480px at 4% 104%,rgba(255,214,10,.08),transparent 58%),
      var(--bg);
    display:flex;align-items:center;justify-content:center;padding:28px;
    -webkit-font-smoothing:antialiased;
    position:relative;isolation:isolate;overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:-18%;z-index:0;pointer-events:none;
    background:
      radial-gradient(620px 420px at 72% 22%,rgba(43,92,230,.16),transparent 66%),
      radial-gradient(520px 380px at 18% 86%,rgba(255,214,10,.05),transparent 66%);
    animation:ambient 20s ease-in-out infinite alternate;
  }
  .shell{
    position:relative;z-index:1;
    width:100%;max-width:940px;
    display:grid;grid-template-columns:330px 1fr;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:22px;overflow:hidden;
    box-shadow:var(--shadow);
    animation:shellIn .8s cubic-bezier(.16,1,.3,1) both;
  }

  /* ---------- Left rail ---------- */
  .rail{
    position:relative;
    background:linear-gradient(165deg,#1e40af 0%,#152c66 55%,#0d1b3d 100%);
    color:var(--white);
    padding:40px 32px;
    display:flex;flex-direction:column;
  }
  .rail::after{
    content:"";position:absolute;inset:auto -70px -90px auto;
    width:240px;height:240px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,214,10,.22),transparent 68%);
    pointer-events:none;
    animation:floatGlow 14s ease-in-out infinite alternate;
  }
  .brand{display:flex;align-items:center;gap:12px;animation:riseIn .7s cubic-bezier(.16,1,.3,1) .1s backwards}
  .mark{
    width:46px;height:46px;border-radius:13px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:800;color:var(--royal-deep);
    background:linear-gradient(140deg,var(--yellow),var(--yellow-deep));
    box-shadow:0 10px 24px rgba(255,214,10,.32);
    animation:markPulse 4.5s ease-in-out 1s infinite;
    transition:transform .3s cubic-bezier(.16,1,.3,1);
  }
  .brand:hover .mark{transform:scale(1.06) rotate(-2deg)}
  .brand b{font-size:20px;letter-spacing:.3px;color:var(--white)}
  .rail-spacer{flex:1}
  .trust{
    display:flex;align-items:center;gap:8px;
    font-size:12.5px;color:rgba(255,255,255,.78);
    padding-top:20px;border-top:1px solid rgba(255,255,255,.16);
    animation:fadeIn .9s ease .35s backwards;
  }
  .trust .dot{
    width:8px;height:8px;border-radius:50%;background:var(--yellow);
    box-shadow:0 0 0 4px rgba(255,214,10,.18);flex:none;
    animation:dotPulse 2.8s ease-out .6s infinite;
  }

  /* ---------- Right stage ---------- */
  .stage{
    padding:56px 50px;
    display:flex;flex-direction:column;justify-content:center;
    min-height:500px;text-align:center;
    background:radial-gradient(520px 320px at 100% 0%,rgba(43,92,230,.12),transparent 70%);
  }

  /* success badge with expanding rings */
  .check-wrap{
    position:relative;width:108px;height:108px;flex:none;
    margin:0 auto 26px;
  }
  .check-wrap::before,
  .check-wrap::after{
    content:"";position:absolute;inset:0;border-radius:50%;
    opacity:0;pointer-events:none;
  }
  .check-wrap::before{
    border:1px solid rgba(79,140,255,.55);
    animation:ripple 3s ease-out .9s infinite;
  }
  .check-wrap::after{
    border:1px solid rgba(255,214,10,.45);
    animation:ripple 3s ease-out 2.4s infinite;
  }
  .check{
    position:relative;z-index:1;width:100%;height:100%;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:46px;font-weight:700;line-height:1;padding-bottom:3px;
    color:var(--yellow);
    background:linear-gradient(145deg,#2b5ce6,#173377);
    border:1px solid rgba(255,214,10,.55);
    box-shadow:0 0 46px rgba(79,140,255,.45),inset 0 1px 0 rgba(255,255,255,.18);
    animation:
      popIn .75s cubic-bezier(.34,1.56,.64,1) .15s backwards,
      checkGlow 3.6s ease-in-out 1.1s infinite;
  }

  h1{
    font-size:30px;font-weight:800;line-height:1.2;letter-spacing:-.4px;
    color:var(--white);margin-bottom:12px;
    animation:riseIn .7s cubic-bezier(.16,1,.3,1) .3s backwards;
  }
  .sub{
    color:var(--muted);font-size:15px;line-height:1.65;
    margin:0 auto 30px;max-width:400px;
    animation:riseIn .7s cubic-bezier(.16,1,.3,1) .38s backwards;
  }

  .actions{
    width:100%;max-width:380px;margin:0 auto;
    animation:riseIn .7s cubic-bezier(.16,1,.3,1) .48s backwards;
  }
  .btn{
    position:relative;overflow:hidden;
    width:100%;padding:16px 18px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:15px;font-weight:700;letter-spacing:.2px;text-decoration:none;
    color:#101b36;
    background:linear-gradient(120deg,var(--yellow),var(--yellow-deep));
    border:1px solid rgba(255,236,140,.9);
    box-shadow:0 10px 28px rgba(255,214,10,.28),inset 0 1px 0 rgba(255,255,255,.35);
    cursor:pointer;
    transition:transform .25s cubic-bezier(.16,1,.3,1),box-shadow .3s ease;
  }
  .btn::before{
    content:"";position:absolute;top:0;bottom:0;left:-140%;width:55%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
    transform:skewX(-18deg);pointer-events:none;
    transition:left .6s cubic-bezier(.16,1,.3,1);
  }
  .btn:hover::before{left:140%}
  .btn:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 34px rgba(255,214,10,.38),inset 0 1px 0 rgba(255,255,255,.4);
  }
  .btn:active{transform:translateY(0) scale(.99)}
  .btn:focus-visible{outline:3px solid rgba(255,214,10,.65);outline-offset:3px}

  .note{
    margin-top:24px;font-size:12px;color:var(--muted);
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    animation:fadeIn .8s ease .62s backwards;
  }
  .note svg{flex:none;color:var(--royal-bright)}

  @media(max-width:760px){
    body{padding:16px}
    .shell{grid-template-columns:1fr}
    .rail{
      flex-direction:row;align-items:center;gap:18px;
      padding:22px 26px;
    }
    .rail-spacer{display:none}
    .trust{display:none}
    .stage{padding:40px 28px;min-height:auto}
    h1{font-size:25px}
    .check-wrap{width:96px;height:96px}
  }

  /* ---------- Motion ---------- */
  @keyframes shellIn{
    from{opacity:0;transform:translateY(22px) scale(.985)}
    to{opacity:1;transform:none}
  }
  @keyframes riseIn{
    from{opacity:0;transform:translateY(16px)}
    to{opacity:1;transform:none}
  }
  @keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
  }
  @keyframes popIn{
    from{opacity:0;transform:scale(.5)}
    to{opacity:1;transform:scale(1)}
  }
  @keyframes ripple{
    0%{transform:scale(1);opacity:.65}
    100%{transform:scale(1.9);opacity:0}
  }
  @keyframes checkGlow{
    0%,100%{box-shadow:0 0 42px rgba(79,140,255,.4),inset 0 1px 0 rgba(255,255,255,.18)}
    50%{box-shadow:0 0 62px rgba(79,140,255,.62),inset 0 1px 0 rgba(255,255,255,.2)}
  }
  @keyframes ambient{
    from{transform:translate3d(-1.5%,-1%,0) scale(1)}
    to{transform:translate3d(1.5%,1.5%,0) scale(1.05)}
  }
  @keyframes floatGlow{
    from{transform:translate3d(0,0,0) scale(1)}
    to{transform:translate3d(-14px,-16px,0) scale(1.08)}
  }
  @keyframes markPulse{
    0%,100%{box-shadow:0 10px 24px rgba(255,214,10,.28)}
    50%{box-shadow:0 12px 32px rgba(255,214,10,.5)}
  }
  @keyframes dotPulse{
    0%{box-shadow:0 0 0 4px rgba(255,214,10,.28)}
    70%{box-shadow:0 0 0 9px rgba(255,214,10,0)}
    100%{box-shadow:0 0 0 4px rgba(255,214,10,0)}
  }

  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="brand">
        <span class="mark">V</span>
        <b>VortexX</b>
      </div>
      <div class="rail-spacer"></div>
      <div class="trust">
        <span class="dot"></span>
        Protected by VortexX Security
      </div>
    </aside>

    <main class="stage">
      <div class="check-wrap" aria-hidden="true">
        <div class="check">✓</div>
      </div>

      <h1>Verification Complete</h1>
      <p class="sub">You're verified. Your access to the free version is unlocked.</p>

      <div class="actions">
        <!-- ▼ point this at your download / app / unlock link ▼ -->
        <a class="btn" href="#">Continue</a>
      </div>

      <p class="note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Verified in this browser &bull; Safe to continue
      </p>
    </main>
  </div>
</body>
</html>
